name: Dependency Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependencies:
    name: Python dependencies (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - incidents-service
          - alerts-service
          - oncall-service
          - status-page-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements-security.txt
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/requirements-security.txt
      - name: Audit service requirements
        run: |
          grep -Ev '^\s*(#|$)' \
            services/${{ matrix.service }}/requirements.txt \
            > "$RUNNER_TEMP/${{ matrix.service }}-requirements.txt"

          python -m pip_audit \
            --requirement "$RUNNER_TEMP/${{ matrix.service }}-requirements.txt" \
            --strict \
            --progress-spinner off
