name: Dependency Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python dependencies (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - incidents-service
          - alerts-service
          - oncall-service
          - status-page-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Audit service requirements
        run: |
          grep -Ev '^\s*(#|$|libs/)' \
            services/${{ matrix.service }}/requirements.txt \
            > "$RUNNER_TEMP/${{ matrix.service }}-requirements.txt"

          python -m pip_audit \
            --requirement "$RUNNER_TEMP/${{ matrix.service }}-requirements.txt" \
            --strict \
            --progress-spinner off
