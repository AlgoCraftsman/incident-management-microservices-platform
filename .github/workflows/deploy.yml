name: Deploy Helm Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      image_sha:
        description: Commit SHA image tag published by CI. Defaults to this workflow commit.
        required: false
        type: string
      namespace:
        description: Kubernetes namespace
        required: true
        default: incident-platform
        type: string
      release_name:
        description: Helm release name
        required: true
        default: incident-platform
        type: string
      timeout:
        description: Helm wait timeout
        required: true
        default: 10m
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      CHART_PATH: infra/helm/incident-platform
      VALUES_FILE: infra/helm/incident-platform/values-prod.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Normalize deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          image_sha="${{ inputs.image_sha }}"
          if [ -z "$image_sha" ]; then
            image_sha="$GITHUB_SHA"
          fi

          if [[ ! "$image_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_sha must be a 40-character lowercase Git commit SHA published by CI."
            exit 1
          fi

          namespace="${{ inputs.namespace }}"
          release_name="${{ inputs.release_name }}"
          timeout="${{ inputs.timeout }}"

          if [[ ! "$namespace" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "::error::namespace must be a valid Kubernetes DNS label."
            exit 1
          fi

          if [[ ! "$release_name" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "::error::release_name must be a valid Helm release name."
            exit 1
          fi

          if [[ ! "$timeout" =~ ^[0-9]+[smh]$ ]]; then
            echo "::error::timeout must use Helm duration format such as 10m, 600s, or 1h."
            exit 1
          fi

          {
            echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "IMAGE_SHA=$image_sha"
            echo "NAMESPACE=$namespace"
            echo "RELEASE_NAME=$release_name"
            echo "HELM_TIMEOUT=$timeout"
          } >> "$GITHUB_ENV"

      - name: Verify deployment secrets
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          PLATFORM_API_KEYS: ${{ secrets.PLATFORM_API_KEYS }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          INCIDENTS_DB_PASSWORD: ${{ secrets.INCIDENTS_DB_PASSWORD }}
          ALERTS_DB_PASSWORD: ${{ secrets.ALERTS_DB_PASSWORD }}
          ONCALL_DB_PASSWORD: ${{ secrets.ONCALL_DB_PASSWORD }}
          STATUS_PAGE_DB_PASSWORD: ${{ secrets.STATUS_PAGE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$KUBE_CONFIG_B64" ] || missing+=("KUBE_CONFIG_B64")
          [ -n "$PLATFORM_API_KEYS" ] || missing+=("PLATFORM_API_KEYS")
          [ -n "$INTERNAL_API_KEY" ] || missing+=("INTERNAL_API_KEY")
          [ -n "$INCIDENTS_DB_PASSWORD" ] || missing+=("INCIDENTS_DB_PASSWORD")
          [ -n "$ALERTS_DB_PASSWORD" ] || missing+=("ALERTS_DB_PASSWORD")
          [ -n "$ONCALL_DB_PASSWORD" ] || missing+=("ONCALL_DB_PASSWORD")
          [ -n "$STATUS_PAGE_DB_PASSWORD" ] || missing+=("STATUS_PAGE_DB_PASSWORD")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required environment secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published service images
        shell: bash
        run: |
          set -euo pipefail

          services=(
            incidents-service
            alerts-service
            oncall-service
            status-page-service
          )

          for service in "${services[@]}"; do
            docker manifest inspect "${IMAGE_REPOSITORY}/${service}:${IMAGE_SHA}" > /dev/null
          done

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      - name: Prepare Helm secret overrides
        shell: bash
        env:
          PLATFORM_API_KEYS: ${{ secrets.PLATFORM_API_KEYS }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          INCIDENTS_DB_PASSWORD: ${{ secrets.INCIDENTS_DB_PASSWORD }}
          ALERTS_DB_PASSWORD: ${{ secrets.ALERTS_DB_PASSWORD }}
          ONCALL_DB_PASSWORD: ${{ secrets.ONCALL_DB_PASSWORD }}
          STATUS_PAGE_DB_PASSWORD: ${{ secrets.STATUS_PAGE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          secret_dir="$RUNNER_TEMP/incident-platform-secrets"
          mkdir -p "$secret_dir"
          chmod 700 "$secret_dir"

          printf '%s' "$PLATFORM_API_KEYS" > "$secret_dir/platform_api_keys"
          printf '%s' "$INTERNAL_API_KEY" > "$secret_dir/internal_api_key"
          printf '%s' "$INCIDENTS_DB_PASSWORD" > "$secret_dir/incidents_db_password"
          printf '%s' "$ALERTS_DB_PASSWORD" > "$secret_dir/alerts_db_password"
          printf '%s' "$ONCALL_DB_PASSWORD" > "$secret_dir/oncall_db_password"
          printf '%s' "$STATUS_PAGE_DB_PASSWORD" > "$secret_dir/status_page_db_password"

          chmod 600 "$secret_dir"/*
          echo "SECRET_VALUES_DIR=$secret_dir" >> "$GITHUB_ENV"

      - name: Dry-run release with hidden secrets
        shell: bash
        run: |
          set -euo pipefail

          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --dry-run=client \
            --hide-secret \
            -f "$VALUES_FILE" \
            --set-string "global.imageTag=$IMAGE_SHA" \
            --set-file "secrets.platformApiKeys=$SECRET_VALUES_DIR/platform_api_keys" \
            --set-file "secrets.internalApiKey=$SECRET_VALUES_DIR/internal_api_key" \
            --set-file "databases.incidents.password=$SECRET_VALUES_DIR/incidents_db_password" \
            --set-file "databases.alerts.password=$SECRET_VALUES_DIR/alerts_db_password" \
            --set-file "databases.oncall.password=$SECRET_VALUES_DIR/oncall_db_password" \
            --set-file "databases.statusPage.password=$SECRET_VALUES_DIR/status_page_db_password" \
            > "$RUNNER_TEMP/release-dry-run.txt"

      - name: Deploy release
        shell: bash
        run: |
          set -euo pipefail

          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --wait \
            --timeout "$HELM_TIMEOUT" \
            -f "$VALUES_FILE" \
            --set-string "global.imageTag=$IMAGE_SHA" \
            --set-file "secrets.platformApiKeys=$SECRET_VALUES_DIR/platform_api_keys" \
            --set-file "secrets.internalApiKey=$SECRET_VALUES_DIR/internal_api_key" \
            --set-file "databases.incidents.password=$SECRET_VALUES_DIR/incidents_db_password" \
            --set-file "databases.alerts.password=$SECRET_VALUES_DIR/alerts_db_password" \
            --set-file "databases.oncall.password=$SECRET_VALUES_DIR/oncall_db_password" \
            --set-file "databases.statusPage.password=$SECRET_VALUES_DIR/status_page_db_password"

      - name: Verify rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl -n "$NAMESPACE" rollout status deployment/incidents-service --timeout=2m
          kubectl -n "$NAMESPACE" rollout status deployment/alerts-service --timeout=2m
          kubectl -n "$NAMESPACE" rollout status deployment/oncall-service --timeout=2m
          kubectl -n "$NAMESPACE" rollout status deployment/status-page-service --timeout=2m
          kubectl -n "$NAMESPACE" get deployments,statefulsets,pods

      - name: Write deployment summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### Helm release deployed"
            echo ""
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Namespace: $NAMESPACE"
            echo "- Release: $RELEASE_NAME"
            echo "- Image tag: $IMAGE_SHA"
            echo "- Image repository: $IMAGE_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up Helm secret files
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${SECRET_VALUES_DIR:-}" ] && [ -d "$SECRET_VALUES_DIR" ]; then
            rm -rf "$SECRET_VALUES_DIR"
          fi
