name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [incidents-service, alerts-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/${{ matrix.service }}/requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: pytest services/${{ matrix.service }}/tests --cov=services/${{ matrix.service }}/app --cov-report=term-missing

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service: [incidents-service, alerts-service]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image repository
        run: echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t "$IMAGE_REPOSITORY/${{ matrix.service }}:${{ github.sha }}" .
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE_REPOSITORY/${{ matrix.service }}:${{ github.sha }}"

  trivy:
    name: Trivy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        service: [incidents-service, alerts-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scan
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t incident-platform/${{ matrix.service }}:${{ github.sha }} .
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: incident-platform/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: .
          framework: dockerfile
          soft_fail: false
