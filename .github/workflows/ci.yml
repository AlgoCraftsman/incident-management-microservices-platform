name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contracts:
    name: API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/incidents-service/requirements.txt
          pip install -r services/alerts-service/requirements.txt
          pip install -r services/oncall-service/requirements.txt
          pip install -r services/status-page-service/requirements.txt
      - name: Verify OpenAPI contracts
        run: python scripts/export_openapi.py --check

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [incidents-service, alerts-service, oncall-service, status-page-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/${{ matrix.service }}/requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: pytest services/${{ matrix.service }}/tests --cov=services/${{ matrix.service }}/app --cov-report=term-missing

  test-common:
    name: Test platform-common
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/platform_common
          pip install pytest
      - name: Run tests
        run: pytest libs/platform_common/tests

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api-contracts, test, test-common]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [incidents-service, alerts-service, oncall-service, status-page-service]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image repository
        run: echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPOSITORY }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          sbom: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'mode=max' || 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  trivy:
    name: Trivy ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        service: [incidents-service, alerts-service, oncall-service, status-page-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scan
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t incident-platform/${{ matrix.service }}:${{ github.sha }} .
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: incident-platform/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"

  deployment-manifests:
    name: Kubernetes and Helm manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0
      - name: Lint Helm chart
        run: |
          helm lint infra/helm/incident-platform
          helm lint infra/helm/incident-platform -f infra/helm/incident-platform/values-prod.yaml
      - name: Render Kubernetes and Helm manifests
        run: |
          mkdir -p rendered
          kubectl kustomize infra/k8s/base > rendered/k8s-base.yaml
          helm template incident-platform infra/helm/incident-platform --namespace incident-platform --create-namespace > rendered/helm-default.yaml
          helm template incident-platform infra/helm/incident-platform --namespace incident-platform --create-namespace -f infra/helm/incident-platform/values-prod.yaml > rendered/helm-prod.yaml
      - name: Validate rendered manifests
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict \
            -summary \
            rendered/k8s-base.yaml \
            rendered/helm-default.yaml \
            rendered/helm-prod.yaml
      - name: Run Checkov IaC policy gate
        run: |
          docker run --rm -v "$PWD:/work" -w /work bridgecrew/checkov@sha256:39894d0672bb53c913b9784614f05c98de167cb2041ff96aa53dbd64a0b4a159 \
            --directory rendered \
            --framework kubernetes \
            --check CKV_K8S_21,CKV_K8S_38,CKV2_K8S_6 \
            --quiet

  checkov:
    name: Checkov Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov Dockerfile scan
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: .
          framework: dockerfile
          soft_fail: false
