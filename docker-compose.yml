services:
  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres-incidents:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: incidents
    ports:
      - "${INCIDENTS_DB_HOST_PORT:-5433}:5432"
    volumes:
      - incidents-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents -d incidents"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres-alerts:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: alerts
      POSTGRES_USER: alerts
      POSTGRES_PASSWORD: alerts
    ports:
      - "${ALERTS_DB_HOST_PORT:-5434}:5432"
    volumes:
      - alerts-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alerts -d alerts"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres-oncall:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: oncall
      POSTGRES_USER: oncall
      POSTGRES_PASSWORD: oncall
    ports:
      - "${ONCALL_DB_HOST_PORT:-5435}:5432"
    volumes:
      - oncall-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncall -d oncall"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres-status-page:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: status_page
      POSTGRES_USER: status_page
      POSTGRES_PASSWORD: status_page
    ports:
      - "${STATUS_PAGE_DB_HOST_PORT:-5436}:5432"
    volumes:
      - status-page-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U status_page -d status_page"]
      interval: 10s
      timeout: 3s
      retries: 5

  incidents-service:
    build:
      context: .
      dockerfile: services/incidents-service/Dockerfile
    environment:
      DATABASE_URL: ${INCIDENTS_DATABASE_URL:-postgresql+psycopg://incidents:incidents@postgres-incidents:5432/incidents}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PLATFORM_API_KEYS: ${PLATFORM_API_KEYS:-dev-platform-key}
      EVENT_STREAM_NAME: ${EVENT_STREAM_NAME:-incident-platform-events}
      SERVICE_NAME: incidents-service
    depends_on:
      postgres-incidents:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${INCIDENTS_SERVICE_HOST_PORT:-8001}:8001"

  alerts-service:
    build:
      context: .
      dockerfile: services/alerts-service/Dockerfile
    environment:
      DATABASE_URL: ${ALERTS_DATABASE_URL:-postgresql+psycopg://alerts:alerts@postgres-alerts:5432/alerts}
      INCIDENTS_SERVICE_URL: ${INCIDENTS_SERVICE_URL:-http://incidents-service:8001}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-platform-key}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PLATFORM_API_KEYS: ${PLATFORM_API_KEYS:-dev-platform-key}
      EVENT_STREAM_NAME: ${EVENT_STREAM_NAME:-incident-platform-events}
      SERVICE_NAME: alerts-service
    depends_on:
      postgres-alerts:
        condition: service_healthy
      redis:
        condition: service_healthy
      incidents-service:
        condition: service_started
    ports:
      - "${ALERTS_SERVICE_HOST_PORT:-8002}:8002"

  oncall-service:
    build:
      context: .
      dockerfile: services/oncall-service/Dockerfile
    environment:
      DATABASE_URL: ${ONCALL_DATABASE_URL:-postgresql+psycopg://oncall:oncall@postgres-oncall:5432/oncall}
      INCIDENTS_SERVICE_URL: ${INCIDENTS_SERVICE_URL:-http://incidents-service:8001}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-platform-key}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PLATFORM_API_KEYS: ${PLATFORM_API_KEYS:-dev-platform-key}
      EVENT_STREAM_NAME: ${EVENT_STREAM_NAME:-incident-platform-events}
      EVENT_CONSUMER_GROUP: oncall-service
      SERVICE_NAME: oncall-service
    depends_on:
      postgres-oncall:
        condition: service_healthy
      redis:
        condition: service_healthy
      incidents-service:
        condition: service_started
    ports:
      - "${ONCALL_SERVICE_HOST_PORT:-8003}:8003"

  status-page-service:
    build:
      context: .
      dockerfile: services/status-page-service/Dockerfile
    environment:
      DATABASE_URL: ${STATUS_PAGE_DATABASE_URL:-postgresql+psycopg://status_page:status_page@postgres-status-page:5432/status_page}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PLATFORM_API_KEYS: ${PLATFORM_API_KEYS:-dev-platform-key}
      EVENT_STREAM_NAME: ${EVENT_STREAM_NAME:-incident-platform-events}
      EVENT_CONSUMER_GROUP: status-page-service
      SERVICE_NAME: status-page-service
    depends_on:
      postgres-status-page:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${STATUS_PAGE_SERVICE_HOST_PORT:-8004}:8004"

volumes:
  redis-data:
  incidents-db:
  alerts-db:
  oncall-db:
  status-page-db:
