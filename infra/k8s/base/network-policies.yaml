apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-redis
  labels:
    app.kubernetes.io/part-of: incident-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - incidents-service
                  - alerts-service
                  - oncall-service
                  - status-page-service
      ports:
        - protocol: TCP
          port: 6379
