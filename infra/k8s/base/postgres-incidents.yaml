apiVersion: v1
kind: Service
metadata:
  name: postgres-incidents
  labels:
    app.kubernetes.io/name: postgres-incidents
    app.kubernetes.io/part-of: incident-platform
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: postgres-incidents
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-incidents
  labels:
    app.kubernetes.io/name: postgres-incidents
    app.kubernetes.io/part-of: incident-platform
spec:
  serviceName: postgres-incidents
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-incidents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-incidents
        app.kubernetes.io/part-of: incident-platform
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: incidents-db-secrets
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "incidents", "-d", "incidents"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "incidents", "-d", "incidents"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
