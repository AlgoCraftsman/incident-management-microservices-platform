apiVersion: v1
kind: Secret
metadata:
  name: platform-shared-secrets
  labels:
    {{- include "incident-platform.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  PLATFORM_API_KEYS: {{ .Values.secrets.platformApiKeys | quote }}
  INTERNAL_API_KEY: {{ .Values.secrets.internalApiKey | quote }}
{{- range $key, $db := .Values.databases }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $db.secretName }}
  labels:
    {{- include "incident-platform.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $db.name }}
type: Opaque
stringData:
  POSTGRES_DB: {{ $db.database | quote }}
  POSTGRES_USER: {{ $db.username | quote }}
  POSTGRES_PASSWORD: {{ $db.password | quote }}
  DATABASE_URL: {{ include "incident-platform.databaseUrl" $db | quote }}
{{- end }}

